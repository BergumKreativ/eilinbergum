<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
</helmet>
<div style="width:100%;font-family:Jost, system-ui, sans-serif;color:#ffffff">
  <sc-if value="{{ desktop }}" hint-placeholder-val="{{ true }}">
    <div style="display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:24px;padding:20px clamp(20px,3.5vw,44px)">
      <div style="display:flex;align-items:center;gap:clamp(14px,1.8vw,26px);font-size:16px;font-weight:400">
        <a href="index.html" style="color:#ffffff;text-decoration:none;padding-bottom:2px" style-hover="color:#FFC20E">Hjem<sc-if value="{{ isHjem }}"><span style="display:block;height:1px;background:#ffffff;margin-top:2px"></span></sc-if></a>
        <a href="om-oss.html" style="color:#ffffff;text-decoration:none;padding-bottom:2px" style-hover="color:#FFC20E">Om oss<sc-if value="{{ isOmOss }}"><span style="display:block;height:1px;background:#ffffff;margin-top:2px"></span></sc-if></a>
        <a href="kontakt.html" style="color:#ffffff;text-decoration:none;padding-bottom:2px" style-hover="color:#FFC20E">Kontakt<sc-if value="{{ isKontakt }}"><span style="display:block;height:1px;background:#ffffff;margin-top:2px"></span></sc-if></a>
        <div onMouseEnter="{{ openServices }}" onMouseLeave="{{ closeServices }}" style="position:relative">
          <button onClick="{{ toggleServices }}" style="appearance:none;background:none;border:0;padding:0 0 2px;margin:0;font:inherit;color:#ffffff;cursor:pointer;display:flex;align-items:center;gap:7px" style-hover="color:#FFC20E">Våre tjenester<span style="font-size:11px;opacity:.7">▾</span><sc-if value="{{ isTjenester }}"><span style="position:absolute;left:0;right:14px;bottom:0;height:1px;background:#ffffff"></span></sc-if></button>
          <sc-if value="{{ servicesOpen }}">
            <div style="position:absolute;top:100%;left:-16px;padding-top:14px;min-width:250px">
              <div style="background:transparent;padding:8px 0;display:flex;flex-direction:column">
                <a href="privat.html" style="color:#ffffff;text-decoration:none;padding:11px 20px;font-size:15px" style-hover="background:rgba(255,194,14,.12);color:#FFC20E">Privat</a>
                <a href="naering.html" style="color:#ffffff;text-decoration:none;padding:11px 20px;font-size:15px" style-hover="background:rgba(255,194,14,.12);color:#FFC20E">Næring og borettslag</a>
                <a href="brannvern.html" style="color:#ffffff;text-decoration:none;padding:11px 20px;font-size:15px" style-hover="background:rgba(255,194,14,.12);color:#FFC20E">Brannvern</a>
              </div>
            </div>
          </sc-if>
        </div>
      </div>
      <a href="index.html" style="display:block;justify-self:center">
        <img src="assets/logo-white.png" alt="B-Lås AS" style="display:block;height:50px;width:auto">
      </a>
      <div style="display:flex;align-items:center;justify-content:flex-end;gap:18px">
        <a href="tel:+4748039918" style="display:flex;align-items:baseline;gap:9px;color:#ffffff;text-decoration:none" style-hover="color:#FFC20E">
          <span style="font-size:12px;letter-spacing:.14em;text-transform:uppercase;opacity:.6">Ring oss</span>
          <span style="font-family:Anton, Impact, sans-serif;font-size:19px;letter-spacing:.03em">48 03 99 18</span>
        </a>
      </div>
    </div>
  </sc-if>
  <sc-if value="{{ mobile }}">
    <div style="padding:14px 18px">
      <div style="display:flex;align-items:center;justify-content:space-between;gap:16px">
        <a href="index.html" style="display:block">
          <img src="assets/logo-white.png" alt="B-Lås AS" style="display:block;height:40px;width:auto">
        </a>
        <div style="display:flex;align-items:center;gap:10px">
          <a href="tel:+4748039918" style="display:flex;align-items:center;justify-content:center;height:44px;padding:0 16px;background:#FFC20E;color:#000000;text-decoration:none;border-radius:999px;font-size:15px;font-weight:500">Ring</a>
          <button onClick="{{ toggleMenu }}" aria-label="Meny" style="appearance:none;background:none;border:1px solid rgba(255,255,255,.3);width:44px;height:44px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;cursor:pointer;padding:0">
            <span style="display:block;width:20px;height:2px;background:#ffffff"></span>
            <span style="display:block;width:20px;height:2px;background:#ffffff"></span>
            <span style="display:block;width:20px;height:2px;background:#ffffff"></span>
          </button>
        </div>
      </div>
      <sc-if value="{{ menuOpen }}">
        <div style="margin-top:14px;background:transparent;display:flex;flex-direction:column">
          <a href="index.html" style="color:#ffffff;text-decoration:none;padding:16px 20px;font-size:17px;border-bottom:1px solid rgba(255,255,255,.18)">Hjem</a>
          <a href="om-oss.html" style="color:#ffffff;text-decoration:none;padding:16px 20px;font-size:17px;border-bottom:1px solid rgba(255,255,255,.18)">Om oss</a>
          <a href="kontakt.html" style="color:#ffffff;text-decoration:none;padding:16px 20px;font-size:17px;border-bottom:1px solid rgba(255,255,255,.18)">Kontakt</a>
          <div style="padding:16px 20px 6px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.5)">Våre tjenester</div>
          <a href="privat.html" style="color:#ffffff;text-decoration:none;padding:13px 20px;font-size:17px">Privat</a>
          <a href="naering.html" style="color:#ffffff;text-decoration:none;padding:13px 20px;font-size:17px">Næring og borettslag</a>
          <a href="brannvern.html" style="color:#ffffff;text-decoration:none;padding:13px 20px 18px;font-size:17px">Brannvern</a>
        </div>
      </sc-if>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:120},&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;hjem&quot;,&quot;om-oss&quot;,&quot;kontakt&quot;,&quot;privat&quot;,&quot;naering&quot;,&quot;brannvern&quot;],&quot;default&quot;:&quot;hjem&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  state = { narrow: false, menuOpen: false, servicesOpen: false };

  componentDidMount() {
    this.mq = window.matchMedia("(max-width: 900px)");
    this.onChange = () => this.setState({ narrow: this.mq.matches, menuOpen: false });
    this.onChange();
    this.mq.addEventListener("change", this.onChange);
  }

  componentWillUnmount() {
    if (this.mq) this.mq.removeEventListener("change", this.onChange);
  }

  renderVals() {
    const active = this.props.active || "";
    return {
      desktop: !this.state.narrow,
      mobile: this.state.narrow,
      menuOpen: this.state.menuOpen,
      servicesOpen: this.state.servicesOpen,
      isHjem: active === "hjem",
      isOmOss: active === "om-oss",
      isKontakt: active === "kontakt",
      isTjenester: active === "privat" || active === "naering" || active === "brannvern",
      toggleMenu: () => this.setState(s => ({ menuOpen: !s.menuOpen })),
      toggleServices: () => this.setState(s => ({ servicesOpen: !s.servicesOpen })),
      openServices: () => this.setState({ servicesOpen: true }),
      closeServices: () => this.setState({ servicesOpen: false })
    };
  }
}
</script>
</body>
</html>
